<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>
<body>
    <header class="header">
        <h1>Expense Tracker</h1>
    </header>

    <main class="main-content">
        <section class="total-dashboard">
            <div>
                <h2>Total Expenses</h2>
                <p id="total-amount">KES 0.00</p>
            </div>

            <label for="home-currency" class="home-currency">
                Home Currency
                <select name="homeCurrency" id="home-currency">
                    <option value="KES">KES</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                </select>
            </label>
        </section>
    </main>
</body>
</html>
